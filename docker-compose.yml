version: '3.8'

services:
  # Serviço do Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: millionaireasy-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Mexc123!
      - POSTGRES_DB=mexc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - millionaireasy-net

  # Serviço do Backend (Spring Boot)
  backend:
    container_name: millionaireasy-backend
    # Constrói a imagem a partir do Dockerfile na pasta do backend
    build:
      context: ./backend_millionaireasy
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # Define as variáveis de ambiente para conexão com o banco de dados
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mexc
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Mexc123!
    depends_on:
      - db
    networks:
      - millionaireasy-net

  # Serviço do Frontend (React + Nginx)
  frontend:
    container_name: millionaireasy-frontend
    # Constrói a imagem a partir do Dockerfile na pasta do frontend
    build:
      context: ./frontend_millionaireasy
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - millionaireasy-net

# Define a rede que os containers usarão para se comunicar
networks:
  millionaireasy-net:
    driver: bridge

# Define o volume para persistência dos dados do banco de dados
volumes:
  postgres-data: